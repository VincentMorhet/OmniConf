; Les 5 services d'un worker (équivalents des unités systemd webconf-*.service des VM).
; Journaux sur la sortie du conteneur : docker logs <conteneur>
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/bin/sh -c 'exec /usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_SIZE)sx24 -nolisten tcp -ac'
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulse]
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit -n -F /etc/webconf/pulse.pa --log-target=stderr --log-level=error
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wm]
command=/bin/sh -c 'sleep 1; exec /usr/bin/matchbox-window-manager -use_titlebar no -use_cursor no'
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/bin/sh -c 'sleep 2; /usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -localhost -rfbport %(ENV_RFB_PORT)s -quiet & exec /usr/bin/websockify %(ENV_VNC_PORT)s localhost:%(ENV_RFB_PORT)s'
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/bin/sh -c 'sleep 2; exec /opt/webconf/venv/bin/uvicorn agent:app --host 0.0.0.0 --port %(ENV_AGENT_PORT)s'
directory=/opt/webconf/worker
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
