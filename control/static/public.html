<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vidéo partagée · OmniConf</title>
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
<style>
  :root { --bg: #f4f6fb; --card: #ffffff; --line: #dce1ee; --fg: #18203a; --mute: #5b6582; --accent: #6d72f6; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #141a2e; --line: #262f4a; --fg: #e8ecf6; --mute: #94a0b8; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header .mark { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6d72f6, #9b6cf6); color: #fff; }
  header .mark svg { width: 20px; height: 20px; }
  header b { font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 40px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 4px; overflow-wrap: anywhere; }
  .sub { color: var(--mute); margin: 0 0 16px; }
  .player { background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  video { display: block; width: 100%; max-height: 78vh; background: #000; }
  .note { color: var(--mute); font-size: 13px; margin-top: 12px; }
  .gone { text-align: center; padding: 70px 16px; color: var(--mute); }
  .gone b { display: block; color: var(--fg); font-size: 18px; margin-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="9" width="2.6" height="6" rx="1.3"/><rect x="7.4" y="6" width="2.6" height="12" rx="1.3"/><rect x="11.8" y="3" width="2.6" height="18" rx="1.3"/><rect x="16.2" y="7" width="2.6" height="10" rx="1.3"/><rect x="20.6" y="10" width="2.2" height="4" rx="1.1"/></g></svg></span>
  <b>OmniConf</b>
</header>
<main>
  <div id="ok" class="hidden">
    <h1 id="title"></h1>
    <p id="sub" class="sub"></p>
    <div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
    <p id="note" class="note"></p>
  </div>
  <div id="gone" class="gone hidden">
    <b>Cette vidéo n'est pas disponible</b>
    Le lien n'existe pas, a expiré ou a été retiré par la personne qui l'a partagé.
  </div>
</main>
<script>
(async () => {
  const token = location.pathname.split("/").filter(Boolean).pop() || "";
  const base = "/api/public/" + encodeURIComponent(token);
  const $ = (id) => document.getElementById(id);
  let d;
  try {
    const r = await fetch(base, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) { $("gone").classList.remove("hidden"); document.title = "Vidéo indisponible · OmniConf"; return; }
  $("title").textContent = d.title;
  document.title = d.title + " · OmniConf";
  const parts = [];
  if (d.started_at) {
    const t = new Date(d.started_at);
    parts.push(t.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
      + " à " + t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
  }
  if (d.duration) {
    const s = Math.round(d.duration), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    parts.push(h ? `${h} h ${String(m).padStart(2, "0")}` : `${m || 1} min`);
  }
  $("sub").textContent = parts.join(" · ");
  $("note").textContent = "Vidéo partagée par lien" + (d.expires ? " jusqu'au "
    + new Date(d.expires).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "") + ".";
  const v = $("video");
  v.poster = base + "/thumb";
  v.src = base + "/video";
  $("ok").classList.remove("hidden");
})();
</script>
</body>
</html>
